# Isolated stack for frontend e2e against backend develop: own container
# names, host ports and volumes, so it runs beside the developer's stack.
services:
  postgres:
    container_name: idolly-e2e-postgres
    ports: !override
      - 5434:5432
    volumes: !override
      - e2e_postgres_data:/var/lib/postgresql/data
  redis:
    container_name: idolly-e2e-redis
    ports: !override
      - 6380:6379
  app:
    container_name: idolly-e2e-backend
    ports: !override
      - 8001:8000
    environment:
      DEBUG: "true"
      BASE_URL: http://localhost:8001
      FRONTEND_BASE_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
  worker:
    container_name: idolly-e2e-worker
    environment:
      DEBUG: "true"
      BASE_URL: http://localhost:8001
      FRONTEND_BASE_URL: http://localhost:8080
volumes:
  e2e_postgres_data:
